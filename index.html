<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>米兰消消乐</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #F5F0E8 0%, #E8E0D5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      touch-action: manipulation;
    }

    h1 {
      color: #4A3F35;
      font-size: 1.8rem;
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .score-board {
      display: flex;
      gap: 30px;
      margin-bottom: 15px;
    }

    .score-item {
      text-align: center;
    }

    .score-label {
      color: #8B7355;
      font-size: 0.85rem;
    }

    .score-value {
      color: #4A3F35;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .game-container {
      background: #F5F0E8;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 8px 32px rgba(74, 63, 53, 0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      touch-action: manipulation;
    }

    .cell {
      width: clamp(38px, 10vw, 48px);
      height: clamp(38px, 10vw, 48px);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(20px, 6vw, 28px);
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .cell:active {
      transform: scale(0.92);
    }

    .cell.selected {
      transform: scale(1.08);
      box-shadow: 0 0 0 3px #4A3F35;
    }

    .cell.matched {
      animation: matchPop 0.3s ease forwards;
    }

    @keyframes matchPop {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }

    .cell.falling {
      animation: fallIn 0.3s ease;
    }

    @keyframes fallIn {
      0% { transform: translateY(-60px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* 米兰迪色系 - 6种颜色 */
    .color-0 { background: #C97064; } /* 陶土红 */
    .color-1 { background: #8B9A6D; } /* 橄榄绿 */
    .color-2 { background: #C9A9A6; } /* 灰粉 */
    .color-3 { background: #D4A84B; } /* 暖金 */
    .color-4 { background: #7BA3A8; } /* 雾蓝 */
    .color-5 { background: #B8A9C9; } /* 薰衣草紫 */

    .btn {
      margin-top: 15px;
      padding: 12px 32px;
      font-size: 1rem;
      background: #4A3F35;
      color: #F5F0E8;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn:hover {
      background: #5D5147;
    }

    .message {
      margin-top: 12px;
      color: #8B7355;
      font-size: 0.9rem;
      height: 20px;
    }

    .combo {
      color: #C97064;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🌸 米兰消消乐</h1>

  <div class="score-board">
    <div class="score-item">
      <div class="score-label">得分</div>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">连击</div>
      <div class="score-value" id="combo">0</div>
    </div>
  </div>

  <div class="game-container">
    <div class="grid" id="grid"></div>
  </div>

  <button class="btn" id="restartBtn">重新开始</button>
  <div class="message" id="message"></div>

  <script>
    const ROWS = 8;
    const COLS = 8;
    const COLORS = 6;

    let grid = [];
    let selected = null;
    let score = 0;
    let combo = 0;
    let isAnimating = false;

    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restartBtn');

    function init() {
      grid = [];
      selected = null;
      score = 0;
      combo = 0;
      isAnimating = false;
      updateScore();
      createGrid();
      render();

      // 初始生成确保没有匹配
      while (findMatches().length > 0) {
        createGrid();
      }
      render();
    }

    function createGrid() {
      grid = [];
      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          grid[r][c] = randomColor();
        }
      }
    }

    function randomColor() {
      return Math.floor(Math.random() * COLORS);
    }

    function render() {
      gridEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = `cell color-${grid[r][c]}`;
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.textContent = getEmoji(grid[r][c]);

          if (selected && selected.r === r && selected.c === c) {
            cell.classList.add('selected');
          }

          cell.addEventListener('click', () => handleClick(r, c));
          cell.addEventListener('touchend', (e) => {
            e.preventDefault();
            handleClick(r, c);
          });
          gridEl.appendChild(cell);
        }
      }
    }

    function getEmoji(color) {
      const emojis = ['🌺', '🌿', '🌸', '⭐', '💧', '🍇'];
      return emojis[color];
    }

    function handleClick(r, c) {
      if (isAnimating) return;

      if (!selected) {
        selected = { r, c };
        render();
      } else {
        const dr = Math.abs(selected.r - r);
        const dc = Math.abs(selected.c - c);

        if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
          // 交换
          swap(selected.r, selected.c, r, c);
        } else {
          // 重新选择
          selected = { r, c };
          render();
        }
      }
    }

    function swap(r1, c1, r2, c2) {
      isAnimating = true;
      [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
      selected = null;
      render();

      const matches = findMatches();
      if (matches.length > 0) {
        combo = 0;
        processMatches();
      } else {
        // 换回来
        setTimeout(() => {
          [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
          render();
          isAnimating = false;
          showMessage('换个位置试试~');
        }, 200);
      }
    }

    function findMatches() {
      const matches = new Set();

      // 横向
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
          const color = grid[r][c];
          if (color === grid[r][c+1] && color === grid[r][c+2]) {
            matches.add(`${r},${c}`);
            matches.add(`${r},${c+1}`);
            matches.add(`${r},${c+2}`);
            // 扩展
            let i = c + 3;
            while (i < COLS && grid[r][i] === color) {
              matches.add(`${r},${i}`);
              i++;
            }
          }
        }
      }

      // 纵向
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
          const color = grid[r][c];
          if (color === grid[r+1][c] && color === grid[r+2][c]) {
            matches.add(`${r},${c}`);
            matches.add(`${r+1},${c}`);
            matches.add(`${r+2},${c}`);
            // 扩展
            let i = r + 3;
            while (i < ROWS && grid[i][c] === color) {
              matches.add(`${i},${c}`);
              i++;
            }
          }
        }
      }

      return Array.from(matches).map(s => {
        const [r, c] = s.split(',').map(Number);
        return { r, c };
      });
    }

    function processMatches() {
      const matches = findMatches();
      if (matches.length === 0) {
        isAnimating = false;
        return;
      }

      combo++;
      score += matches.length * 10 * combo;
      updateScore();

      if (combo > 1) {
        showMessage(`<span class="combo">${combo} 连击！</span>`);
      }

      // 标记消除动画
      matches.forEach(({ r, c }) => {
        const index = r * COLS + c;
        const cell = gridEl.children[index];
        if (cell) cell.classList.add('matched');
      });

      setTimeout(() => {
        // 移除匹配的
        matches.forEach(({ r, c }) => {
          grid[r][c] = -1;
        });

        // 下落
        drop();
        render();

        // 补充新的
        fillNew();
        render();

        setTimeout(() => processMatches(), 300);
      }, 300);
    }

    function drop() {
      for (let c = 0; c < COLS; c++) {
        let emptyRow = ROWS - 1;
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r][c] !== -1) {
            grid[emptyRow][c] = grid[r][c];
            if (emptyRow !== r) grid[r][c] = -1;
            emptyRow--;
          }
        }
      }
    }

    function fillNew() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === -1) {
            grid[r][c] = randomColor();
          }
        }
      }
    }

    function updateScore() {
      scoreEl.textContent = score;
      comboEl.textContent = combo;
    }

    function showMessage(msg) {
      messageEl.innerHTML = msg;
      setTimeout(() => {
        if (messageEl.textContent === msg) messageEl.textContent = '';
      }, 1500);
    }

    restartBtn.addEventListener('click', init);
    restartBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      init();
    });

    init();
  </script>
</body>
</html>
